<title>Herança de Cinzas</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">

<canvas id="game" aria-label="Mapa da fazenda"></canvas>

<div id="hud">
  <button id="res" class="box" title="Abrir o mercado da Casa da Fazenda">
    <span class="g"><img id="icG" class="px" alt=""><span id="gold">0</span></span>
    <span class="w"><img id="icW" class="px" alt=""><span id="trigo">0</span>&nbsp;trigo</span>
    <span class="a"><img id="icA" class="px" alt=""><span id="alho">0</span>&nbsp;alho</span>
  </button>
  <div id="phase" class="box">
    <div id="phaseT">Dia 1</div>
    <div id="clock"><i id="clockFill"></i></div>
    <button id="skip" hidden>Chamar a noite</button>
  </div>
  <div id="side">
    <div id="speed">
      <button id="pauseBtn" aria-label="Pausar">❚❚</button>
      <button id="spdBtn" class="on" aria-label="Velocidade">1×</button>
      <button id="menuBtn" aria-label="Menu">☰</button>
    </div>
    <button id="heroBtn">Heróis 0</button>
  </div>
</div>

<div id="log" aria-live="polite"></div>

<div id="bottom">
  <div id="hint" class="box" hidden></div>
  <div id="quest" class="box" hidden></div>
  <section id="panel" class="box" hidden>
    <header>
      <canvas id="pPort" class="px" width="1" height="1"></canvas>
      <div><h2 id="pTitle"></h2><p id="pSub"></p></div>
      <button id="pClose" aria-label="Fechar">×</button>
    </header>
    <dl id="pRows"></dl>
    <p id="pNote" hidden></p>
    <div id="pAct"></div>
  </section>
  <nav id="bar" aria-label="Construir">
    <div id="cats" role="tablist"></div>
    <div id="barRow"><button id="buildAll" aria-label="Abrir todas as construções">Construir</button><button id="barL" class="arr" aria-label="Rolar pra esquerda" hidden>‹</button><div id="items"></div><button id="barR" class="arr" aria-label="Rolar pra direita" hidden>›</button></div>
  </nav>
</div>

<section id="buildMenu" class="box" hidden aria-label="Construir">
  <header><h2>Construir</h2><span id="bmGold"></span><button id="bmClose" aria-label="Fechar">×</button></header>
  <div id="bmList"></div>
</section>

<section id="roster" class="box" hidden>
  <header><h2>Seus heróis</h2><button id="rClose" aria-label="Fechar">×</button></header>
  <p id="rSum"></p>
  <div id="rList"></div>
</section>

<div id="overlay">
  <div class="card box" id="card">
    <canvas id="titleScene" class="px" width="200" height="84"></canvas>
    <div id="cBody"></div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/palette.js"></script>
<script src="js/pixel.js"></script>
<script src="js/sprites-buildings.js"></script>
<script src="js/sprites-world.js"></script>
<script src="js/sprites-units.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/world.js"></script>
<script src="js/economy.js"></script>
<script src="js/combat.js"></script>
<script src="js/ai.js"></script>
<script src="js/update.js"></script>
<script src="js/save.js"></script>
<script src="js/screens.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
