<title>Herança de Cinzas</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: mapa em pixel art em tela cheia; HUD em cima, pedido + painel + barra de construção embaixo; lista de heróis à direita. Paleta fixa "Cinza e Brasa". */
:root{
  --k:#0d0b0c; --k2:#1a1517; --k3:#2a2224; --g1:#3b3133; --g2:#4f4446; --g3:#6a5d5c; --g5:#a89a92; --g6:#c9bdb0; --g7:#ece3d6;
  --e2:#a3301a; --e3:#d9561f; --e4:#ff8a2b; --e5:#ffc35a; --y1:#b8892e; --y2:#e5be55; --b1:#8f1d22; --v2:#7d8a5e;
  --f:"Pixelify Sans","Courier New",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--k);color:var(--g7);overflow:hidden;font-family:var(--f);font-size:16px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
canvas.px,img.px{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:var(--g7);background:var(--k3);border:2px solid var(--k);border-radius:0;padding:5px 10px;cursor:pointer;
  box-shadow:inset 0 0 0 1px var(--g2),inset 0 -3px 0 var(--k2);touch-action:manipulation}
button:hover{background:var(--g1)}
button:active{box-shadow:inset 0 0 0 1px var(--g2),inset 0 3px 0 var(--k2)}
button:focus-visible{outline:2px solid var(--e4);outline-offset:1px}
button:disabled{opacity:.4;cursor:default}
.box{background:var(--k2);border:2px solid var(--k);box-shadow:inset 0 0 0 2px var(--g1),4px 4px 0 rgba(0,0,0,.55)}

#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px));pointer-events:none}
#hud>*{pointer-events:auto}
#res{display:flex;flex-direction:column;gap:2px;padding:6px 10px 6px 8px;text-align:left;font-weight:600;font-variant-numeric:tabular-nums;min-width:76px}
#res span{display:flex;align-items:center;gap:6px;line-height:1.1}
#res img{width:22px;height:22px}
#res .g{font-size:19px;color:var(--y2)}
#res .w{font-size:14px;color:var(--e5)}
#res .a{font-size:14px;color:var(--g6)}
#phase{flex:1;min-width:0;text-align:center;padding:6px 8px}
#phaseT{font-size:18px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
#clock{height:6px;background:var(--k);margin:6px auto 0;max-width:220px;box-shadow:inset 0 0 0 1px var(--g1)}
#clockFill{display:block;height:100%;width:0;background:var(--e4)}
#skip{margin-top:6px;padding:2px 10px;font-size:14px;color:var(--e5)}
#side{display:flex;flex-direction:column;gap:4px;align-items:stretch}
#speed{display:flex;gap:4px}
#speed button{padding:4px 8px;min-width:38px;font-size:15px}
#speed button.on{color:var(--e4)}
#heroBtn{font-size:14px;padding:4px 8px;color:var(--y2)}

#log{position:fixed;left:max(10px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 104px);
  width:min(400px,calc(100vw - 20px));display:flex;flex-direction:column;gap:4px;pointer-events:none}
#log div{background:rgba(13,11,12,.88);border-left:4px solid var(--e3);padding:4px 10px;font-size:15px;line-height:1.25;transition:opacity .7s;box-shadow:3px 3px 0 rgba(0,0,0,.5)}
#log div.bad{border-color:var(--b1)}
#log div.good{border-color:var(--v2)}

#bottom{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:stretch;pointer-events:none}
#bottom>*{pointer-events:auto}
#hint{align-self:center;margin:0 12px 8px;padding:5px 12px;font-size:15px;text-align:center}
#quest{align-self:flex-start;display:flex;align-items:center;gap:10px;margin:0 max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));
  max-width:min(480px,calc(100vw - 20px));box-sizing:border-box;padding:7px 10px;border-left:6px solid var(--y1)}
#quest .qt{flex:1;min-width:0;font-size:15px;line-height:1.25}
#quest .qt b{color:var(--y2)}
#quest .qp{color:var(--g5);font-variant-numeric:tabular-nums}
#quest button{flex:0 0 auto;color:var(--y2)}
#panel{margin:0 max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));max-width:440px;padding:10px 12px 12px;box-sizing:border-box}
#panel header{display:flex;align-items:flex-start;gap:10px}
#pPort{flex:0 0 auto;background:var(--k);box-shadow:inset 0 0 0 2px var(--g1);padding:3px}
#panel header>div{flex:1;min-width:0}
#pTitle{font-weight:700;font-size:21px;margin:0;line-height:1.05;color:var(--e4)}
#pSub{margin:3px 0 0;color:var(--g5);font-size:14px}
#pClose{padding:1px 8px;font-size:18px;line-height:1}
#pRows{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 0;font-size:15px}
#pRows div{display:contents}
#pRows dt{color:var(--g5)}
#pRows dd{margin:0;font-variant-numeric:tabular-nums;min-width:0}
#pNote{margin:8px 0 0;font-size:14px;color:var(--g6);line-height:1.3}
#pAct{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#bar{display:flex;flex-direction:column;gap:6px;background:var(--k2);border-top:2px solid var(--k);box-shadow:inset 0 2px 0 var(--g1);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(10px,env(safe-area-inset-left,0px))}
#cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:3px 12px;font-size:15px;color:var(--g5)}
.cat.on{color:var(--e5);background:#3a1e14;box-shadow:inset 0 0 0 2px var(--e3),inset 0 -3px 0 var(--k2)}
#barRow{display:flex;align-items:stretch;gap:4px}
#items{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--g2) var(--k);padding-bottom:4px}
#items::-webkit-scrollbar{height:6px}
#items::-webkit-scrollbar-track{background:var(--k)}
#items::-webkit-scrollbar-thumb{background:var(--g2)}
.arr{flex:0 0 auto;width:30px;padding:0;font-size:20px;color:var(--e5)}
#buildAll{flex:0 0 auto;padding:4px 14px;font-size:17px;font-weight:700;color:var(--g7);background:var(--e2);box-shadow:inset 0 0 0 2px var(--e3),inset 0 -3px 0 var(--b1)}
#buildAll:hover{background:var(--e3)}
#buildMenu{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));max-width:620px;margin:0 auto;display:flex;flex-direction:column;padding:10px;box-sizing:border-box}
#buildMenu header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#buildMenu h2{flex:1;margin:0;font-size:22px;color:var(--e4)}
#bmGold{color:var(--y2);font-size:16px}
#bmList{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;align-content:start;padding-right:4px}
#bmList h3{grid-column:1/-1;margin:8px 0 0;font-size:16px;color:var(--g5);letter-spacing:.08em;text-transform:uppercase}
.bm{display:grid;grid-template-columns:48px 1fr;gap:2px 8px;align-items:start;text-align:left;padding:8px}
.bm img{grid-row:span 3;width:48px;height:44px;object-fit:contain;align-self:center}
.bm b{font-size:16px}
.bm .c{font-size:14px;color:var(--y2)}
.bm .d{font-size:13px;color:var(--g6);line-height:1.25}
.bm.poor{opacity:.5}
.bm.poor .c{color:var(--b1)}
.bb{flex:0 0 auto;display:grid;grid-template-columns:auto auto;align-items:center;gap:0 6px;padding:4px 8px;text-align:left}
.bb img{grid-row:span 2;height:34px;width:auto;max-width:44px;object-fit:contain}
.bb b{font-size:14px;white-space:nowrap;font-weight:600}
.bb span{font-size:13px;color:var(--y2);font-variant-numeric:tabular-nums}
.bb.on{background:#3a1e14;box-shadow:inset 0 0 0 2px var(--e3),inset 0 -3px 0 var(--k2)}
.bb.poor{opacity:.45}

#roster{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 70px);
  width:min(360px,calc(100vw - 20px));display:flex;flex-direction:column;padding:10px;box-sizing:border-box}
#roster header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#roster h2{flex:1;margin:0;font-size:20px;color:var(--e4)}
#rSum{font-size:13px;color:var(--g5);margin:0 0 8px}
#rList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.hr{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;text-align:left;padding:6px 8px;width:100%;box-sizing:border-box}
.hr canvas{grid-row:span 3;background:var(--k);box-shadow:inset 0 0 0 1px var(--g1)}
.hr .n{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr .c{font-size:13px;color:var(--g5)}
.hr .hp{height:5px;background:var(--k);box-shadow:inset 0 0 0 1px var(--g1);margin-top:3px}
.hr .hp i{display:block;height:100%;background:var(--v2)}
.hr .s{grid-column:1 / -1;font-size:13px;color:var(--g6)}
.hr .s em{color:var(--y2);font-style:normal}
.hr.dead{opacity:.5}
#rEmpty{color:var(--g5);font-size:14px;line-height:1.35}

#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(13,11,12,.82);
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(14px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:500px;max-height:100%;overflow:auto;padding:18px 20px 18px;box-sizing:border-box}
#titleScene{display:block;width:100%;height:auto;margin:0 0 10px;box-shadow:inset 0 0 0 2px var(--g1)}
.eyebrow{margin:0;color:var(--g5);font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.card h1{font-weight:700;font-size:40px;line-height:1;margin:2px 0 10px;color:var(--e4);text-shadow:3px 3px 0 var(--b1),6px 6px 0 var(--k);text-wrap:balance}
.lead{font-size:18px;line-height:1.35;margin:0 0 10px}
.goal{margin:0 0 10px;padding:7px 10px;border-left:6px solid var(--b1);background:var(--k3)}
.how{margin:0 0 14px;padding-left:18px;line-height:1.35;color:var(--g6);font-size:15px}
.how li{margin-bottom:4px}
.cta{width:100%;padding:10px 14px;font-size:19px;font-weight:700;background:var(--e2);color:var(--g7);box-shadow:inset 0 0 0 2px var(--e3),inset 0 -4px 0 var(--b1)}
.cta:hover{background:var(--e3)}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 16px;margin:0 0 14px}
.stats div{display:contents}
.stats dt{color:var(--g5)}
.stats dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.menu button{width:100%;padding:10px 12px;font-size:19px}
.saveinfo{margin:-2px 0 4px;font-size:14px;color:var(--g5);text-align:center;line-height:1.3}
.foot{margin:12px 0 0;font-size:13px;color:var(--g5);text-align:center;line-height:1.3}
.opt{display:grid;gap:6px;margin:0 0 14px}
.opt .lbl{font-size:16px}
.opt .why{font-size:13px;color:var(--g5)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px}
.seg button.on{background:#3a1e14;color:var(--e5);box-shadow:inset 0 0 0 2px var(--e3),inset 0 -3px 0 var(--k2)}
.menu button.slot{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font-size:18px;padding:10px 12px}
.slotinfo{font-size:14px;color:var(--g5);font-weight:400}
.slot.cta .slotinfo{color:var(--g7)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 button{flex:1;min-width:120px}
#menuBtn{min-width:38px}
@media (max-width:520px){
  #phaseT{font-size:15px}
  #res .g{font-size:17px}
  #speed button{min-width:32px;padding:3px 6px}
  .card h1{font-size:32px}
  #log{top:calc(env(safe-area-inset-top,0px) + 112px)}
}
</style>

<canvas id="game" aria-label="Mapa da fazenda"></canvas>

<div id="hud">
  <button id="res" class="box" title="Abrir o mercado da Casa da Fazenda">
    <span class="g"><img id="icG" class="px" alt=""><span id="gold">0</span></span>
    <span class="w"><img id="icW" class="px" alt=""><span id="trigo">0</span>&nbsp;trigo</span>
    <span class="a"><img id="icA" class="px" alt=""><span id="alho">0</span>&nbsp;alho</span>
  </button>
  <div id="phase" class="box">
    <div id="phaseT">Dia 1</div>
    <div id="clock"><i id="clockFill"></i></div>
    <button id="skip" hidden>Chamar a noite</button>
  </div>
  <div id="side">
    <div id="speed">
      <button id="pauseBtn" aria-label="Pausar">❚❚</button>
      <button id="spdBtn" class="on" aria-label="Velocidade">1×</button>
      <button id="menuBtn" aria-label="Menu">☰</button>
    </div>
    <button id="heroBtn">Heróis 0</button>
  </div>
</div>

<div id="log" aria-live="polite"></div>

<div id="bottom">
  <div id="hint" class="box" hidden></div>
  <div id="quest" class="box" hidden></div>
  <section id="panel" class="box" hidden>
    <header>
      <canvas id="pPort" class="px" width="1" height="1"></canvas>
      <div><h2 id="pTitle"></h2><p id="pSub"></p></div>
      <button id="pClose" aria-label="Fechar">×</button>
    </header>
    <dl id="pRows"></dl>
    <p id="pNote" hidden></p>
    <div id="pAct"></div>
  </section>
  <nav id="bar" aria-label="Construir">
    <div id="cats" role="tablist"></div>
    <div id="barRow"><button id="buildAll" aria-label="Abrir todas as construções">Construir</button><button id="barL" class="arr" aria-label="Rolar pra esquerda" hidden>‹</button><div id="items"></div><button id="barR" class="arr" aria-label="Rolar pra direita" hidden>›</button></div>
  </nav>
</div>

<section id="buildMenu" class="box" hidden aria-label="Construir">
  <header><h2>Construir</h2><span id="bmGold"></span><button id="bmClose" aria-label="Fechar">×</button></header>
  <div id="bmList"></div>
</section>

<section id="roster" class="box" hidden>
  <header><h2>Seus heróis</h2><button id="rClose" aria-label="Fechar">×</button></header>
  <p id="rSum"></p>
  <div id="rList"></div>
</section>

<div id="overlay">
  <div class="card box" id="card">
    <canvas id="titleScene" class="px" width="200" height="84"></canvas>
    <div id="cBody"></div>
  </div>
</div>

<script>
(()=>{
'use strict';
const W=2000,H=1400,CYCLE=150,DAY_END=90,DUSK_END=105,NIGHT_END=145,NIGHTS=7;
const $=s=>document.querySelector(s);
const cv=$('#game'),ctx=cv.getContext('2d');

/* ---------- utilidades ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-(ax+dx*t),py-(ay+dy*t));}

/* ---------- paleta "Cinza e Brasa" e quantização ---------- */
const PAL={
  k:'#0d0b0c',k2:'#1a1517',k3:'#2a2224',g1:'#3b3133',g2:'#4f4446',g3:'#6a5d5c',g4:'#877a76',g5:'#a89a92',g6:'#c9bdb0',g7:'#ece3d6',
  w0:'#2e1d16',w1:'#4a2e20',w2:'#6b442c',w3:'#8e5f3a',w4:'#b5844f',
  e0:'#3d0f0c',e1:'#6e1a12',e2:'#a3301a',e3:'#d9561f',e4:'#ff8a2b',e5:'#ffc35a',e6:'#fff1b8',
  y0:'#7a5a1f',y1:'#b8892e',y2:'#e5be55',
  v0:'#2f3528',v1:'#4d5a3d',v2:'#7d8a5e',
  n0:'#14121f',n1:'#262338',n2:'#3e3a57',n3:'#635d80',
  b0:'#5c0f14',b1:'#8f1d22',p0:'#3a2440',p1:'#5e3a63',z0:'#9be36b',s0:'#d8b48a',s1:'#b08660',s2:'#8a6248'
};
const PL=Object.values(PAL).map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
const LUT=new Int32Array(32768);
for(let r=0;r<32;r++)for(let g=0;g<32;g++)for(let b=0;b<32;b++){
  const R=r*8+4,G_=g*8+4,B=b*8+4;let best=0,bd=1e9;
  for(let i=0;i<PL.length;i++){const p=PL[i],dr=R-p[0],dg=G_-p[1],db=B-p[2];const d=dr*dr*2+dg*dg*4+db*db*3;if(d<bd){bd=d;best=i;}}
  const p=PL[best];LUT[(r<<10)|(g<<5)|b]=(p[0]<<16)|(p[1]<<8)|p[2];
}
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const BOFF=new Int16Array(16);for(let i=0;i<16;i++)BOFF[i]=Math.round((BAYER[i]/16-.47)*22);

/* ---------- pintura de pixels ---------- */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,w);c.height=Math.max(1,h);return c;}
function Pnt(g){
  const P={
    px(x,y,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),1,1);},
    rect(x,y,w,h,c){if(w<=0||h<=0)return;g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));},
    line(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);g.fillStyle=c;
      const dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1;let e=dx+dy;
      for(let n=0;n<999;n++){g.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}},
    disc(cx,cy,rx,ry,c){g.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);
      for(let y=-ry;y<=ry;y++){const t=1-(y*y)/((ry+.5)*(ry+.5));if(t<0)continue;const hw=Math.round(rx*Math.sqrt(t));g.fillRect(cx-hw,cy+y,hw*2+1,1);}},
    dith(x,y,w,h,c,lvl){g.fillStyle=c;x=Math.round(x);y=Math.round(y);const L=lvl*16;
      for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(BAYER[(((y+j)&3)<<2)|((x+i)&3)]<L)g.fillRect(x+i,y+j,1,1);},
    trap(y0,y1,xl0,xr0,xl1,xr1,c){g.fillStyle=c;for(let y=y0;y<=y1;y++){const t=y1===y0?0:(y-y0)/(y1-y0);
      const a=Math.round(xl0+(xl1-xl0)*t),b=Math.round(xr0+(xr1-xr0)*t);g.fillRect(a,y,b-a+1,1);}},

/* ---------- tela e câmera de pixel ---------- */
function zRange(){const mn=Math.max(1,Math.ceil(cv.width/560));return [mn,mn+6];}
function defaultZ(){const [a,b]=zRange();const off=typeof OPTS==='undefined'?0:OPTS.pixel==='maior'?1:OPTS.pixel==='menor'?-1:0;return clamp(Math.round(cv.width/360)+off,a,b);}
function resize(){
  dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.max(1,Math.round(window.innerWidth*dpr));cv.height=Math.max(1,Math.round(window.innerHeight*dpr));
  const [a,b]=zRange();Z=clamp(Z,a,b);fitBuffer();
}
function fitBuffer(){const w=Math.max(1,Math.ceil(cv.width/Z)),h=Math.max(1,Math.ceil(cv.height/Z));
  if(buf.width!==w||buf.height!==h){buf.width=lb.width=w;buf.height=lb.height=h;bx=buf.getContext('2d',{willReadFrequently:true});}bw=w;bh=h;}
let lastW=-1,lastH=-1;
function checkSize(){if(window.innerWidth!==lastW||window.innerHeight!==lastH){const first=lastW<10;lastW=window.innerWidth;lastH=window.innerHeight;resize();if(first){Z=defaultZ();fitBuffer();}}}
window.addEventListener('resize',checkSize);
const s2w=(sx,sy)=>({x:OX+sx*dpr/Z,y:OY+sy*dpr/Z});
function clampCam(){const hx=bw/2,hy=bh/2;cam.x=W>bw?clamp(cam.x,hx,W-hx):W/2;cam.y=H>bh?clamp(cam.y,hy-40,H-hy+60):H/2;}
function setZ(nz,sx,sy){const [a,b]=zRange();nz=clamp(Math.round(nz),a,b);if(nz===Z)return;const p=s2w(sx,sy);Z=nz;fitBuffer();
  cam.x=p.x-(sx*dpr/Z)+bw/2;cam.y=p.y-(sy*dpr/Z)+bh/2;clampCam();OX=Math.round(cam.x-bw/2);OY=Math.round(cam.y-bh/2);}

/* ---------- mapa ---------- */
function mkLair(kind,x,y){const l={ent:'lair',kind,x,y,r:58,hp:kind==='cemiterio'?480:380,dead:false,bounty:0,hitT:0,alarm:0,defT:0,
  name:kind==='cemiterio'?'Cemitério Antigo':'Ninho de Strigoi'};l.maxHp=l.hp;return l;}
function genMap(R){
  const cx=W/2,cy=H/2;G.cracks=[];
  for(let i=0;i<6;i++){const a=R()*Math.PI*2,r=140+R()*380;let x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r*.75,dir=R()*Math.PI*2;
    const pts=[{x,y}];const n=5+Math.floor(R()*5);
    for(let k=0;k<n;k++){dir+=(R()-.5)*1.1;const len=35+R()*55;const nx=clamp(x+Math.cos(dir)*len,60,W-60),ny=clamp(y+Math.sin(dir)*len,80,H-60);
      if(Math.hypot(nx-cx,ny-cy)<120)break;x=nx;y=ny;pts.push({x,y});}
    if(pts.length>1)G.cracks.push(pts);}
  G.segs=[];for(const c of G.cracks)for(let i=1;i<c.length;i++)G.segs.push([c[i-1].x,c[i-1].y,c[i].x,c[i].y]);
  G.lightPts=[];for(const s of G.segs){const L=Math.hypot(s[2]-s[0],s[3]-s[1]);const n=Math.max(1,Math.round(L/40));
    for(let i=0;i<n;i++){const t=(i+.5)/n;G.lightPts.push({x:s[0]+(s[2]-s[0])*t,y:s[1]+(s[3]-s[1])*t,ph:R()*6});}}
  const corners=[[280,260],[W-280,260],[280,H-240],[W-280,H-240]];const ci=Math.floor(R()*4),c1=corners[ci],c2=corners[3-ci];
  G.lairs=[mkLair('cemiterio',Math.round(c1[0]+(R()-.5)*80),Math.round(c1[1]+(R()-.5)*60)),mkLair('ninho',Math.round(c2[0]+(R()-.5)*80),Math.round(c2[1]+(R()-.5)*60))];
  const ok=(x,y,m)=>Math.hypot(x-cx,y-cy)>m&&G.lairs.every(l=>Math.hypot(l.x-x,l.y-y)>110)&&G.decor.every(o=>Math.hypot(o.x-x,o.y-y)>18);
  G.decor=[];
  for(let i=0;i<75;i++){const x=Math.round(40+R()*(W-80)),y=Math.round(70+R()*(H-90));if(ok(x,y,200))G.decor.push({kind:'tree',x,y,spr:TREES[Math.floor(R()*TREES.length)]});}
  for(let i=0;i<90;i++){const x=Math.round(30+R()*(W-60)),y=Math.round(50+R()*(H-60));if(ok(x,y,150))G.decor.push({kind:'rock',x,y,spr:ROCKS[Math.floor(R()*ROCKS.length)]});}
  const addProp=(type,x,y)=>{x=Math.round(x);y=Math.round(y);const p=PROPS[type];G.decor.push({ent:'prop',kind:'prop',type,x,y,spr:PROP_SPR[type],name:p.name,lore:p.lore[Math.floor(R()*p.lore.length)]});};
  const near=(type,ang)=>{const a=ang+(R()-.5)*.6,r=150+R()*70;addProp(type,cx+Math.cos(a)*r,cy+Math.sin(a)*r*.75);};
  near('poco',Math.PI*1.2);near('espantalho',-.4);near('carroca',Math.PI*.7);
  const scatter=(type,n)=>{for(let i=0;i<n*4&&n>0;i++){const x=60+R()*(W-120),y=100+R()*(H-160);if(ok(x,y,260)){addProp(type,x,y);n--;}}};
  scatter('troita',3);scatter('cranios',3);scatter('lapide',7);scatter('gaiola',2);
  for(const l of G.lairs){for(let i=0;i<3;i++){const a=R()*Math.PI*2;addProp(l.kind==='cemiterio'?'lapide':'cranios',l.x+Math.cos(a)*(90+R()*30),l.y+Math.sin(a)*(60+R()*20));}}
  ground=genGround(R);
}
function genGround(R){
  const c=mkCanvas(W,H),g=c.getContext('2d'),P=Pnt(g);
  const grd=g.createRadialGradient(W/2,H/2,80,W/2,H/2,W*.72);grd.addColorStop(0,'#5a524f');grd.addColorStop(1,'#2a2425');g.fillStyle=grd;g.fillRect(0,0,W,H);
  for(let i=0;i<900;i++){const x=R()*W,y=R()*H,r=10+R()*R()*60;g.fillStyle=`rgba(${R()<.5?'20,16,17':'110,100,96'},${.06+R()*.1})`;g.beginPath();g.ellipse(x,y,r,r*.6,0,0,Math.PI*2);g.fill();}
  const sp=[PAL.k3,PAL.g1,PAL.g2,PAL.g3,PAL.g4,PAL.g5];
  for(let i=0;i<60000;i++){g.fillStyle=sp[Math.floor(R()*sp.length)];g.fillRect(R()*W|0,R()*H|0,1,1);}
  for(let i=0;i<3500;i++){const x=R()*W|0,y=R()*H|0;g.fillStyle=R()<.5?PAL.g5:PAL.g6;g.fillRect(x,y,2+(R()*6|0),1);}
  for(let i=0;i<1600;i++){const x=R()*W|0,y=R()*H|0;P.px(x,y,PAL.g2);P.px(x+1,y,PAL.g3);P.px(x,y+1,PAL.k3);}
  for(let i=0;i<900;i++){const x=R()*W|0,y=R()*H|0;P.px(x,y,PAL.g4);P.px(x-1,y-1,PAL.g4);P.px(x+1,y-1,PAL.g5);}
  for(let i=0;i<220;i++){const x=R()*W|0,y=R()*H|0;P.px(x,y,PAL.g6);P.px(x+1,y,PAL.g7);}
  for(let i=0;i<500;i++){const x=R()*W|0,y=R()*H|0;P.px(x,y,PAL.e1);}
  for(const cr of G.cracks){
    for(let i=1;i<cr.length;i++){const a=cr[i-1],b=cr[i];const L=Math.hypot(b.x-a.x,b.y-a.y);
      for(let t=0;t<=L;t+=6){const x=a.x+(b.x-a.x)*t/L,y=a.y+(b.y-a.y)*t/L;const gg=g.createRadialGradient(x,y,0,x,y,34);gg.addColorStop(0,'rgba(70,30,18,.35)');gg.addColorStop(1,'rgba(70,30,18,0)');g.fillStyle=gg;g.fillRect(x-34,y-34,68,68);}}
    for(let i=1;i<cr.length;i++){const a=cr[i-1],b=cr[i];
      for(let k=-3;k<=3;k++)P.line(a.x,a.y+k,b.x,b.y+k,Math.abs(k)>=3?PAL.w0:PAL.k2);
      for(let k=-1;k<=1;k++)P.line(a.x+k,a.y,b.x+k,b.y,PAL.e1);
      P.line(a.x,a.y,b.x,b.y,PAL.e3);P.line(a.x,a.y-1,b.x,b.y-1,PAL.e2);
      const L=Math.hypot(b.x-a.x,b.y-a.y);for(let t=0;t<L;t+=3+R()*5){const x=a.x+(b.x-a.x)*t/L,y=a.y+(b.y-a.y)*t/L;P.px(x,y,R()<.4?PAL.e5:PAL.e4);
        if(R()<.15)P.line(x,y,x+(R()-.5)*14,y+(R()-.5)*10,PAL.k2);}}}
  return c;
}
function heatAt(x,y){let d=1e9;for(const s of G.segs){const v=segDist(x,y,s[0],s[1],s[2],s[3]);if(v<d)d=v;}return clamp(1-d/170,0,1);}

function findB(kind,p){let best=null,bd=1e9;for(const b of G.buildings){if(b.kind!==kind||b.dead)continue;const d=p?dist(p,b):0;if(d<bd){bd=d;best=b;}}return best;}
function nearest(arr,p,maxD,f){let best=null,bd=maxD;for(const u of arr){if(u.dead||u.inside||(f&&!f(u)))continue;const d=dist(p,u);if(d<bd){bd=d;best=u;}}return best;}
function rectDist(p,b){const dx=Math.max(Math.abs(p.x-b.x)-b.w/2,0),dy=Math.max(Math.abs(p.y-b.y)-b.dd/2,0);return Math.hypot(dx,dy);}

/* ---------- tempo ---------- */
const dayT=()=>G.time%CYCLE;
function darkness(){const D=OPTS.night==='clara'?.55:.78,t=dayT();if(t<DAY_END)return 0;if(t<DUSK_END)return (t-DAY_END)/(DUSK_END-DAY_END)*D;if(t<NIGHT_END)return D;return D*(1-(t-NIGHT_END)/(CYCLE-NIGHT_END));}
function isNight(){const t=dayT();return t>=DUSK_END-4&&t<NIGHT_END+2;}
const workersHide=()=>{const t=dayT();return t>=DAY_END+4&&t<NIGHT_END+1;};
function phaseOf(t){return t<DAY_END?'day':t<DUSK_END?'dusk':t<NIGHT_END?'night':'dawn';}

function floatT(x,y,text,color){G.floats.push({x,y,text,color:color||PAL.g7,life:1.6,max:1.6});}
function part(x,y,vx,vy,life,c,s,type){if(G.parts.length>500)return;G.parts.push({x,y,vx,vy,life,max:life,c,s,type});}
function burst(x,y,c,n){for(let i=0;i<n;i++)part(x,y,rnd(-40,40),rnd(-60,-10),rnd(.3,.7),c,1,'spark');}

/* ---------- economia ---------- */
function newPrices(){G.price={trigo:ri(2,4),alho:ri(3,7)};}
function deposit(c,at){G[c.crop]+=c.amt;G.stats.crops+=c.amt;floatT(at.x,baseY(at)-30,`+${c.amt} ${c.crop}`,cropColor(c.crop));}
function sell(crop,n){n=Math.min(n,G[crop]);if(n<=0)return;const v=n*G.price[crop];G[crop]-=n;G.gold+=v;G.stats.sold+=v;
  const c=casa();floatT(c.x,baseY(c)-52,`+${v} ouro`,PAL.y2);burst(c.x,baseY(c)-30,PAL.y2,10);}
function workerHomes(){return [casa(),...G.buildings.filter(b=>b.kind==='casebre'&&!b.dead)];}
function refillWorkers(announce){let n=0;
  for(const h of workerHomes()){let have=G.units.filter(u=>u.worker&&u.home===h&&!u.dead).length;
    while(have<2){addU('campones',h.x+rnd(-12,12),baseY(h)+8,{home:h,name:'Camponês'});have++;n++;}}
  if(announce&&n)msg(n===1?'Chegou um camponês. Não tinha pra onde ir.':`Chegaram ${n} camponeses. Não tinham pra onde ir.`,'good');}
function dropPoint(w){let best=casa(),bd=dist(w,best);for(const h of workerHomes()){const d=dist(w,h);if(d<bd){bd=d;best=h;}}return best;}

/* ---------- pedidos do dia ---------- */
function newQuest(){
  const day=G.nightsDone+1;
  const opts=[
    {who:'O bispo',crop:'trigo',need:6+day*3,kind:'gold',fail:'O bispo não recebeu o trigo. Ficou ofendido. O cobrador vai passar.'},
    {who:'A vila vizinha',crop:'alho',need:3+day*2,kind:'gold',fail:'A vila vizinha comprou alho de outro. Ninguém liga pra você.'},
    {who:'O padre',crop:'trigo',need:5+day*2,kind:'bless',fail:'O padre rezou mesmo assim. Não adiantou nada.'},
    {who:'O ferreiro da estrada',crop:'alho',need:4+day*2,kind:'gold',fail:'O ferreiro foi embora resmungando. Vai falar mal de você na estrada.'},
    {who:'A guarda do barão',crop:'trigo',need:8+day*3,kind:'hero',fail:'A guarda do barão passou com fome. Levou uma galinha que você nem sabia que tinha.'},
  ];
  const q=Object.assign({},pick(opts));q.id=G.nextId++;if(q.kind==='gold')q.pay=Math.round(q.need*G.price[q.crop]*2+10);G.quest=q;questSig='';
}
function questReward(q){return q.kind==='gold'?`Paga ${q.pay} de ouro.`:q.kind==='bless'?'Em troca, a próxima noite vem com menos mortos.':'Em troca, manda um soldado pra você.';}
function deliverQuest(){
  const q=G.quest;if(!q||G[q.crop]<q.need)return;G[q.crop]-=q.need;G.quest=null;
  if(q.kind==='gold'){G.gold+=q.pay;G.stats.sold+=q.pay;msg(`${q.who} pagou ${q.pay} de ouro. Até sorriu. Foi estranho.`,'good');}
  else if(q.kind==='bless'){G.blessed=true;msg('O padre benzeu a fazenda. Jura que funciona.','good');}
  else{const c=casa();const h=makeHero(pick(['warrior','lancer']),c.x+20,baseY(c)+10,{home:c});msg(`A guarda do barão deixou ${h.name} com você. Traço: ${h.trait}. Sem devolução.`,'good');}
  const c=casa();burst(c.x,baseY(c)-30,PAL.y2,14);
}
let questSig='';
function updateQuest(){const el=$('#quest');const q=G&&G.quest;
  if(!q||!started||G.over||buildMode){el.hidden=true;questSig='';return;}
  el.hidden=false;const have=G[q.crop],ok=have>=q.need;const sig=q.id+':'+have+':'+ok;if(sig===questSig)return;questSig=sig;
  el.innerHTML=`<div class="qt"><b>Pedido:</b> ${q.who} quer ${q.need} de ${q.crop} até a noite. ${questReward(q)} <span class="qp">(${Math.min(have,q.need)}/${q.need})</span></div><button id="qBtn"${ok?'':' disabled'}>Entregar</button>`;}
$('#quest').addEventListener('click',e=>{if(e.target.closest('#qBtn'))deliverQuest();});

/* ---------- jogo novo ---------- */
function freshG(seed){
  return {seed,time:12,gold:100,trigo:0,alho:0,nightsDone:0,nightNum:0,phase:'day',buildings:[],units:[],lairs:[],proj:[],parts:[],floats:[],decor:[],spawnQ:[],birds:[],
    over:false,stats:{heroDead:0,peasantDead:0,monDead:0,crops:0,sold:0,earned:0},farmerCd:0,rotMsgT:0,sunMsg:false,smokeT:0,emberT:0,wolfT:45,wolfMsg:false,
    birdT:8,flash:0,shake:0,nextId:1,ghost:null,quest:null,blessed:false,taxDue:false,peasantMsgT:0,fallen:[],lastSave:0};
}
function newGame(){
  const seed=Math.floor(Math.random()*1e9),R=mulberry32(seed);
  G=freshG(seed);
  genMap(R);newPrices();
  G.casa=addB('casa',W/2,H/2);
  let best=null,bh=-1;
  for(let i=0;i<80;i++){const a=R()*Math.PI*2,r=110+R()*140;const x=W/2+Math.cos(a)*r,y=H/2+Math.sin(a)*r*.8;if(canPlace('trigo',x,y))continue;const h=heatAt(x,y);if(h>bh){bh=h;best={x,y};}}
  if(best){const f=addB('trigo',best.x,best.y);f.g=.8;}
  refillWorkers(false);
  const v=makeHero('warrior',W/2+24,H/2+44,{name:'Primo Vasile',trait:'Bêbado'});v.gold=5;
  newQuest();sel=null;buildMode=null;cam.x=W/2;cam.y=H/2+10;
  $('#log').innerHTML='';renderBar();updatePanel(true);updateHint();renderRoster(true);
}
function startPlay(){newGame();G.slot=pendingSlot||1;applyOpts(true);started=true;$('#overlay').hidden=true;msg('Seu primo Vasile veio ajudar. Ele bebe.');
  setTimeout(()=>{if(G&&!G.over)msg(`No mercado hoje: trigo a ${G.price.trigo}, alho a ${G.price.alho}. Toque no seu ouro pra vender.`,'good');},2500);}

/* ---------- construção ---------- */
function canPlace(kind,x,y){const d=BD[kind];
  if(x<d.w/2+20||x>W-d.w/2-20||y<d.d/2+80||y>H-d.d/2-20)return 'Fora do mapa';
  for(const b of G.buildings)if(Math.abs(b.x-x)<(b.w+d.w)/2+6&&Math.abs(b.y-y)<(b.dd+d.d)/2+6)return 'Tem coisa ai';
  for(const l of G.lairs)if(!l.dead&&Math.hypot(l.x-x,l.y-y)<l.r+70)return 'Perto do covil';
  return null;}
function canBuild(kind,x,y){if(G.gold<BD[kind].cost)return 'Falta ouro';return canPlace(kind,x,y);}
function tryBuild(kind,x,y){const why=canBuild(kind,x,y);if(why){floatT(x,y-16,why,PAL.e4);return;}
  const d=BD[kind];G.gold-=d.cost;const b=addB(kind,x,y);burst(b.x,b.y,PAL.g5,12);
  if(!d.field){buildMode=null;refreshBar();updateHint();select(b);}
  if(kind==='casebre')refillWorkers(true);
  if(kind==='taverna'&&!G.firstTav){G.firstTav=1;msg('A taverna abriu. Os heróis vão chegar. O Vasile já chegou.');}}
function harvestNow(b){const c=fieldYield(b);deposit(c,b);b.g=0;b.ripeT=0;b.claim=null;burst(b.x,b.y,cropColor(c.crop),8);}
function recruit(b){const d=BD[b.kind];const n=G.units.filter(u=>u.home===b&&u.hero&&!u.dead).length;
  if(n>=4){msg('O alojamento está cheio. Ninguém quer dividir cama com mercenário.');return;}
  if(G.gold<d.rc){msg('Falta ouro. Herói não trabalha de graça. Nem com.','bad');return;}
  G.gold-=d.rc;const h=makeHero(d.cls,b.x,baseY(b)+6,{home:b});msg(`${h.name} entrou pra ${d.short}. Traço: ${h.trait}.`);}
function repair(b){const c=Math.ceil((b.maxHp-b.hp)*.25);if(G.gold<c){msg('Falta ouro pro conserto.','bad');return;}G.gold-=c;b.hp=b.maxHp;burst(b.x,b.y-10,PAL.g5,8);}
function farmer(){if(G.farmerCd>0)return;const c=casa();makeHero('fazendeiro',c.x,baseY(c)+6,{name:'Você',trait:'Teimoso',life:35,home:c});G.farmerCd=60;msg('O fazendeiro saiu com o forcado. A família reza.');}
function addBounty(e,amt){if(G.gold<amt){msg('Falta ouro pra recompensa.','bad');return;}G.gold-=amt;e.bounty+=amt;floatT(e.x,e.y-34,'+'+amt+' recompensa',PAL.y2);}
function skipToNight(){if(!G||G.phase!=='day'||!started||G.over)return;G.time+=(DAY_END-1)-dayT();msg('Você chamou a noite. Ela veio.');}

/* ---------- ondas ---------- */
function scheduleWave(){
  const n=G.nightNum,fields=G.buildings.filter(isField).length,cem=G.lairs[0],nin=G.lairs[1];
  const add=(type,count,src)=>{for(let i=0;i<count;i++)G.spawnQ.push({at:G.time+1+Math.random()*30,type,src});};
  let sk=Math.round(3+n*2+fields*.4),st=Math.round(1+n*1.2+fields*.25);
  if(cem.dead)sk=Math.ceil(sk/2);if(nin.dead)st=Math.ceil(st/2);
  if(G.blessed){G.blessed=false;const cut=Math.round(sk*.4);sk-=cut;msg(`A bênção do padre funcionou: ${cut} mortos ficaram deitados.`,'good');}
  if(G.alho>0&&st>0){const used=Math.min(G.alho,Math.ceil(st*.7));G.alho-=used;const scared=Math.min(st,Math.floor(used*.8+.5));st-=scared;
    msg(`Você pendurou ${used} cabeças de alho. ${scared} strigoi desistiram.${st?' Os outros gostam de tempero.':''}`,'good');}
  add('esqueleto',sk,cem);add('strigoi',st,nin);if(n===NIGHTS)G.spawnQ.push({at:G.time+2,type:'avo',src:cem});
}
function edgePoint(){const s=Math.floor(Math.random()*4);return {x:s===0?20:s===1?W-20:rnd(40,W-40),y:s===2?80:s===3?H-20:rnd(90,H-40)};}
function spawnFrom(q){let x,y;
  if(q.src&&!q.src.dead){const a=Math.random()*Math.PI*2;x=q.src.x+Math.cos(a)*30;y=q.src.y+Math.sin(a)*20;}else{const p=edgePoint();x=p.x;y=p.y;}
  const boss=q.type==='avo';const m=addU(q.type,x,y,{hpMul:boss?1:1+.13*Math.max(0,G.nightNum-1)});m.think=0;
  if(boss){msg('Seu avô voltou do cemitério. Ele quer a fazenda de volta.','bad');G.shake=6;}}
function spawnWolves(){const alive=G.units.filter(u=>u.type==='lobo').length;if(alive>=8)return;
  const n=Math.min(8-alive,1+Math.floor(G.nightsDone/2));const p=edgePoint();
  for(let i=0;i<n;i++){const m=addU('lobo',p.x+rnd(-20,20),p.y+rnd(-20,20),{hpMul:1+.1*G.nightsDone});m.think=0;}
  if(!G.wolfMsg){G.wolfMsg=true;msg('Lobos de cinza rondando a fazenda. Os camponeses estão nervosos. Os heróis, animados.','bad');}}

/* ---------- eventos do amanhecer ---------- */
function wanderer(){const p=edgePoint();const tv=findB('taverna');const h=makeHero(pick(Object.keys(CLS)),p.x,p.y,{home:tv||casa()});
  msg(`Um andarilho chegou: ${h.name}. Diz que é herói. Ninguém acredita.`,'good');}
function dawnEvent(){
  if(G.taxDue){G.taxDue=false;const x=Math.round(G.gold*.3);G.gold-=x;msg(`O cobrador do bispo veio, como prometido. Levou ${x} de ouro.`,'bad');return;}
  const evs=[],bs=G.buildings.filter(b=>b.kind!=='casa'&&!isField(b)),fields=G.buildings.filter(isField);
  if(bs.length)evs.push(()=>{const b=pick(bs);b.hp=Math.max(1,b.hp-Math.round(b.maxHp*.5));b.hitT=.5;burst(b.x,b.y,PAL.e4,14);G.shake=4;
    msg(`A terra se abriu embaixo da ${BD[b.kind].short||BD[b.kind].name}. Ficou em pé. Mais ou menos.`,'bad');});
  if(fields.length>1)evs.push(()=>{let k=0;for(const f of fields)if(Math.random()<.4){f.g=0;k++;}
    msg(k?`Praga nos campos. ${k} ${k===1?'plantação morreu':'plantações morreram'} de desgosto.`:'A praga passou e não achou nada que valesse a pena.','bad');});
  if(G.trigo>10)evs.push(()=>{const x=Math.round(G.trigo*.3);G.trigo-=x;msg(`Ratos no trigo. Comeram ${x}. Estão gordos e felizes.`,'bad');});
  if(G.gold>60)evs.push(()=>{const x=Math.round(G.gold*.2);G.gold-=x;msg(`O cobrador do bispo passou. Levou ${x} de ouro e deixou uma bênção.`,'bad');});
  const rich=G.units.filter(u=>u.hero&&u.type!=='fazendeiro'&&!u.dead&&u.gold>=10&&u.trait!=='Honesto');
  if(rich.length)evs.push(()=>{const h=pick(rich);msg(`${h.name} foi embora com ${h.gold} de ouro. Deixou um bilhete: "desculpa".`,'bad');G.fallen.unshift({name:h.name,cls:h.t.name,lvl:h.lvl,how:'Fugiu com o ouro',type:h.type});leaveB(h);h.dead=true;if(sel===h)select(null);});
  if(fields.length)evs.push(()=>{for(const f of fields)f.g=Math.min(1,f.g+.4);msg('A cinza da noite adubou os campos. Melhor não perguntar de quê.','good');});
  evs.push(wanderer);
  evs.push(()=>{G.price.trigo+=2;msg(`Fome na capital. O trigo subiu pra ${G.price.trigo} hoje.`,'good');});
  if(Math.random()<.85)pick(evs)();
}
function onPhase(ph){
  if(ph==='dusk')msg('O sol está indo embora. Os camponeses correm pra dentro. Tem coisa se mexendo nos covis.','bad');
  else if(ph==='night'){G.nightNum++;if(G.quest){const q=G.quest;G.quest=null;msg(q.fail,'bad');if(q.who==='O bispo')G.taxDue=true;}
    msg(NIGHT_MSG[Math.min(G.nightNum,NIGHTS)-1],'bad');scheduleWave();}
  else if(ph==='day'&&G.nightNum>G.nightsDone){
    G.nightsDone=G.nightNum;if(G.nightsDone>=NIGHTS){endGame(true);return;}
    const alive=G.units.filter(u=>u.hero&&u.type!=='fazendeiro'&&!u.t.minion&&!u.dead).length;
    msg(`Amanheceu. ${alive} ${alive===1?'herói vivo':'heróis vivos'}. Por enquanto.`);
    G.sunMsg=false;newPrices();dawnEvent();refillWorkers(true);newQuest();G.wolfT=rnd(15,30);
    if(findB('taverna')&&Math.random()<.6)wanderer();
    if(OPTS.autosave)saveGame(true);
    setTimeout(()=>{if(G&&!G.over)msg(`No mercado hoje: trigo a ${G.price.trigo}, alho a ${G.price.alho}.`);},1800);}
}

/* ---------- combate ---------- */
function shoot(x,y,tg,dmg,src){const col=src&&src.ent==='u'?src.t.bolt||null:null;G.proj.push({x,y,tg,dmg,src,spd:col?280:360,a:0,col});}
function attack(a,tg){a.swingT=.25;if(a.t.ranged)shoot(a.x,a.y-10,tg,a.atk,a);else hit(a,tg,a.atk);}
function hit(src,tg,dmg,noSplash){
  if(tg.dead)return;const st=src&&src.ent==='u'?src.t:null;let d=dmg;
  if(st&&tg.ent==='u'&&tg.mon){if(st.undeadMul&&tg.t.undead)d*=st.undeadMul;if(st.crit&&!noSplash&&Math.random()<st.crit){d*=3;floatT(tg.x,tg.y-24,'Critico!',PAL.e5);}}
  if(tg.ent==='u'&&tg.t.armor)d*=1-tg.t.armor;
  if(st&&st.drain&&src.hp>0&&!src.dead)src.hp=Math.min(src.maxHp,src.hp+d*st.drain);
  tg.hp-=d;tg.hitT=.15;if(tg.ent==='lair')tg.alarm=4;
  burst(tg.x,tg.ent==='u'?tg.y-9:tg.y-12,tg.ent==='u'&&tg.mon?PAL.g6:PAL.e4,3);
  if(tg.ent==='u'&&tg.hero&&!tg.t.minion&&tg.state==='idle'&&src&&src.ent==='u'){tg.state='fight';tg.target=src;}
  if(st&&!noSplash&&tg.ent!=='b'&&(st.splash||st.cleave)){const r=st.splash||16,f=st.cleave||.5;
    for(const o of G.units){if(o===tg||o.dead||o.inside||!o.mon)continue;if(dist(o,tg)<=r)hit(src,o,dmg*f,true);}
    if(st.splash)for(let i=0;i<10;i++)part(tg.x,tg.y-8,rnd(-50,50),rnd(-50,20),.4,st.bolt||PAL.e4,1,'spark');}
  if(tg.hp<=0){if(tg.ent==='u')killU(tg,src);else if(tg.ent==='lair')killLair(tg,src);else destroyB(tg);}
}
function gainXp(h,x){if(h.t.minion)return;h.xp+=x;while(h.xp>=h.lvl*25){h.xp-=h.lvl*25;h.lvl++;h.maxHp=Math.round(h.maxHp*1.15);h.atk*=1.12;h.hp=h.maxHp;floatT(h.x,h.y-26,'Nivel '+h.lvl,PAL.y2);burst(h.x,h.y-10,PAL.y2,10);}checkPromo(h);}
function guildOf(cls){return G.buildings.find(b=>!b.dead&&BD[b.kind].cls===cls&&b.prestige)||null;}
function checkPromo(h){if(h.dead||h.t.tier!==1||h.lvl<PROMO_LVL)return;const g=guildOf(h.type);if(g)promote(h,g.prestige);}
function promote(h,p){const o=h.t,n=UT[p];h.type=p;h.t=n;h.maxHp=Math.round(h.maxHp*n.hp/o.hp);h.hp=h.maxHp;h.atk+=n.atk-o.atk;
  burst(h.x,h.y-10,PAL.y2,22);floatT(h.x,h.y-30,n.name+'!',PAL.y2);msg(PROMO_MSG[p](h.name),'good');if(sel===h)portraitFor=null;rosterSig='';}
function choosePrestige(){const pp=G.pendPres;if(!pp||pp.b.dead||pp.b.prestige)return;if(G.gold<PRES_COST){msg('Falta ouro pro prestígio.','bad');return;}
  G.gold-=PRES_COST;pp.b.prestige=pp.p;G.pendPres=null;const b=pp.b;burst(b.x,baseY(b)-30,PAL.y2,30);G.shake=3;portraitFor=null;
  msg(`${BD[b.kind].name} virou ${PRES_GUILD[pp.p]}. Heróis daqui viram ${UT[pp.p].name} no nível ${PROMO_LVL}.`,'good');
  for(const u of G.units)if(u.hero&&!u.dead&&u.type===BD[b.kind].cls)checkPromo(u);}
function payBounty(e,src,label){if(!e.bounty)return;
  if(src&&src.ent==='u'&&src.hero){src.gold+=e.bounty;msg(`${src.name} levou a recompensa de ${e.bounty} pelo ${label}.`,'good');}
  else{const back=Math.floor(e.bounty*.9);G.gold+=back;msg(`Ninguém cobrou a recompensa. Voltaram ${back} de ouro. O bispo ficou com o resto.`);}e.bounty=0;}
function killU(u,src){
  if(u.dead)return;u.dead=true;leaveB(u);if(u.field){u.field.claim=null;u.field=null;}if(sel===u)select(null);
  if(u.t.minion){burst(u.x,u.y-6,u.type==='servo'?PAL.z0:PAL.n3,8);return;}
  if(src&&src.ent==='u'&&src.t.minion)src=src.owner&&!src.owner.dead?src.owner:null;
  if(u.mon){G.stats.monDead++;burst(u.x,u.y-6,PAL.g6,8);
    if(src&&src.ent==='u'&&src.hero){src.gold+=u.t.gold;src.kills++;gainXp(src,u.t.xp);floatT(src.x,src.y-24,'+'+u.t.gold,PAL.y2);
      if(src.type==='fazendeiro'&&src.kills===1)msg(`O fazendeiro matou um ${u.t.name.toLowerCase()}. Vai contar essa história até morrer. Ou seja, logo.`,'good');}
    if(!u.t.boss&&!u.t.beast){const nc=nearest(G.units,u,160,x=>x.type==='necromancer');
      if(nc&&Math.random()<nc.t.raise&&G.units.filter(x=>x.owner===nc&&!x.dead).length<4){addU('servo',u.x,u.y,{owner:nc,life:30,name:'Servo de '+nc.name.split(' ')[0]});burst(u.x,u.y-6,PAL.z0,10);
        if(!G.raiseMsg){G.raiseMsg=true;msg(`${nc.name} levantou um morto pra lutar do seu lado. Sem salário.`,'good');}}}
    payBounty(u,src,u.t.boss?'seu avô':u.t.name.toLowerCase());if(u.t.boss){msg('O Avô caiu. De novo. Ninguém chorou desta vez.','good');G.shake=6;}}
  else if(u.worker){burst(u.x,u.y-6,PAL.b1,8);G.stats.peasantDead++;if(G.time>G.peasantMsgT){G.peasantMsgT=G.time+15;msg(pick(PEASANT_DEATH),'bad');}}
  else{burst(u.x,u.y-6,PAL.b1,10);
    if(u.type==='fazendeiro'){const c=casa();c.hp=Math.max(1,c.hp-Math.round(c.maxHp*.2));msg('O fazendeiro voltou pra casa em pedaços. A casa sentiu.','bad');}
    else{G.stats.heroDead++;msg(pick(DEATH)(u.name),'bad');G.fallen.unshift({name:u.name,cls:u.t.name,lvl:u.lvl,how:`Morreu no dia ${G.nightsDone+1}`,type:u.type});}}
}
function killLair(l,src){if(l.dead)return;l.dead=true;l.hp=0;burst(l.x,l.y,PAL.e4,30);G.shake=5;if(src&&src.ent==='u'&&src.hero)gainXp(src,60);
  payBounty(l,src,l.name.toLowerCase());msg(`${l.name} destruído. Os ataques vão diminuir. Não vão parar.`,'good');if(sel===l)select(null);}
function destroyB(b){if(b.dead)return;b.dead=true;G.buildings=G.buildings.filter(x=>x!==b);burst(b.x,b.y-10,PAL.e4,24);G.shake=4;
  for(const h of b.inside.slice()){h.inside=null;killU(h,null);}b.inside=[];if(sel===b)select(null);
  if(b.kind==='casa'){endGame(false);return;}msg(isField(b)?'Um campo foi pisoteado até virar estrada.':`${BD[b.kind].name} foi destruída.`,'bad');}
function enterB(h,b){h.inside=b;b.inside.push(h);h.x=b.x;h.y=baseY(b)+4;}
function leaveB(h){if(h.inside){h.inside.inside=h.inside.inside.filter(x=>x!==h);h.inside=null;}}

/* ---------- IA ---------- */
function moveTo(u,tx,ty,spd,dt){const dx=tx-u.x,dy=ty-u.y,d=Math.hypot(dx,dy);
  if(d>1.5){const s=Math.min(d,spd*dt);u.x+=dx/d*s;u.y+=dy/d*s;u.moving=true;if(Math.abs(dx)>.5)u.face=dx<0?-1:1;}return d;}
function restPlace(h){return findB('taverna',h)||casa();}
const gearCost=h=>25+h.gear*25;
function patrolPt(h,r){const base=h.home&&!h.home.dead?h.home:casa();r=r||(h.t.ranged?320:h.type==='fazendeiro'?120:190);
  const a=Math.random()*Math.PI*2,d=Math.random()*r;return {x:clamp(base.x+Math.cos(a)*d,30,W-30),y:clamp(base.y+Math.sin(a)*d*.8,80,H-30)};}
function bestBounty(h){let best=null,bv=-1e9;
  const consider=e=>{if(e.dead||!e.bounty)return;const danger=e.ent==='lair'?4:e.t&&e.t.boss?6:1;
    const need=6*danger*(h.trait==='Ganancioso'?2.5:1)/(1+(h.lvl-1)*.3);if(e.bounty<need)return;const v=e.bounty/need-dist(h,e)/1500;if(v>bv){bv=v;best=e;}};
  for(const u of G.units)if(u.mon)consider(u);for(const l of G.lairs)consider(l);return best;}
function heroThink(h){
  if(h.state==='flee'&&h.dest&&!h.dest.dead)return;
  const fleeAt=h.trait==='Covarde'?.55:(h.trait==='Valente'||h.trait==='Teimoso')?-1:.28;
  if(h.hp<h.maxHp*fleeAt){h.state='flee';h.goal='rest';h.dest=restPlace(h);h.target=null;return;}
  if(h.type==='fazendeiro'&&h.life<=0){h.state='go';h.goal='home';h.dest=casa();h.target=null;return;}
  if(h.trait==='Bêbado'&&isNight()){const tv=findB('taverna',h);if(tv){if(!(h.state==='go'&&h.goal==='drink')){h.state='go';h.goal='drink';h.dest=tv;h.target=null;}return;}}
  if(h.state==='fight'&&h.target&&!h.target.dead&&(h.target.bounty>0||dist(h,h.target)<(isNight()?230:420)))return;
  const aggro=isNight()?(h.t.ranged?175:130):(h.type==='fazendeiro'?200:400);
  const e=nearest(G.units,h,aggro,u=>u.mon);if(e){h.state='fight';h.target=e;return;}
  const b=bestBounty(h);if(b){h.state='fight';h.target=b;return;}
  if(h.state==='go')return;
  const f=findB('forja',h);if(f&&!isNight()&&h.gold>=gearCost(h)&&h.type!=='fazendeiro'){h.state='go';h.goal='shop';h.dest=f;return;}
  const tv=findB('taverna',h);if(tv&&!isNight()&&h.gold>=6&&h.hp<h.maxHp*.8&&h.type!=='fazendeiro'){h.state='go';h.goal='rest';h.dest=tv;return;}
  if(h.state!=='idle'){h.state='idle';h.wp=null;h.target=null;}
}
function arrive(h,b){
  if(h.goal==='rest'){enterB(h,b);h.state='rest';}
  else if(h.goal==='drink'){enterB(h,b);h.state='drink';}
  else if(h.goal==='shop'){const c=gearCost(h);if(h.gold>=c){h.gold-=c;G.gold+=c;G.stats.earned+=c;h.gear++;h.atk+=2;h.maxHp+=8;h.hp+=8;
      floatT(b.x,baseY(b)-44,'+'+c+' ouro',PAL.y2);floatT(h.x,h.y-24,'Equip '+h.gear,PAL.g7);}h.state='idle';h.wp=null;}
  else if(h.goal==='home'){h.dead=true;if(sel===h)select(null);
    msg(h.kills?`O fazendeiro voltou pra casa com ${h.kills} ${h.kills===1?'vitória':'vitórias'} e um joelho a menos.`:'O fazendeiro voltou pra casa. Inteiro, desta vez.');}
  h.goal=null;
}
function tavernPay(h,b){if(b.kind!=='taverna')return;h.eatT=(h.eatT||0)+1;
  if(G.trigo>0&&h.gold>=3&&h.eatT>=3){h.eatT=0;G.trigo--;h.gold-=3;G.gold+=3;G.stats.earned+=3;floatT(b.x,baseY(b)-50,'+3',PAL.y2);}
  else if(h.gold>0){h.gold--;G.gold++;G.stats.earned++;}}
function heroUpdate(h,dt){
  if(h.type==='fazendeiro')h.life-=dt;
  if(h.inside){const b=h.inside;h.payT=(h.payT||0)+dt;
    if(h.state==='rest'){const tav=b.kind==='taverna';h.hp=Math.min(h.maxHp,h.hp+(tav?10:4)*dt);if(tav&&h.payT>=1.5){h.payT=0;tavernPay(h,b);}if(h.hp>=h.maxHp*.97){leaveB(h);h.state='idle';h.wp=null;}}
    else if(h.state==='drink'){if(h.payT>=2.5){h.payT=0;tavernPay(h,b);}if(!isNight()){leaveB(h);h.state='idle';h.wp=null;}}
    else{leaveB(h);h.state='idle';}return;}
  h.think-=dt;if(h.think<=0){h.think=.4+Math.random()*.2;heroThink(h);}
  if(h.t.regen&&h.hp<h.maxHp)h.hp=Math.min(h.maxHp,h.hp+h.t.regen*dt);
  if(h.t.heal){h.healT=(h.healT||0)-dt;if(h.healT<=0){h.healT=h.t.healCd||2.2;const amt=Math.round(h.t.heal+h.lvl*3);
    const fx=a=>{a.hp=Math.min(a.maxHp,a.hp+amt);floatT(a.x,a.y-22,'+'+amt,PAL.z0);for(let i=0;i<6;i++)part(a.x+rnd(-5,5),a.y-8,0,rnd(-30,-15),.7,PAL.z0,1,'spark');};
    if(h.t.aoeHeal){let any=false;for(const a of G.units){if(a.dead||a.inside||!(a.hero||a.worker)||a.hp>=a.maxHp*.95||dist(a,h)>100)continue;fx(a);any=true;}if(!any)h.healT=.5;}
    else{const a=nearest(G.units,h,120,u=>(u.hero||u.worker)&&u.hp<u.maxHp*.85);if(a)fx(a);else h.healT=.5;}}}
  if(h.t.summons){h.sumT=(h.sumT===undefined?3:h.sumT)-dt;
    if(h.sumT<=0){const mine=G.units.filter(x=>x.owner===h&&!x.dead&&x.type==='espirito').length;
      if(mine<h.t.summons&&(isNight()||nearest(G.units,h,260,u=>u.mon))){h.sumT=12;addU('espirito',h.x+rnd(-10,10),h.y+6,{owner:h,life:25,name:'Cão Espectral'});burst(h.x,h.y-6,PAL.n3,12);}else h.sumT=1;}}
  const spd=h.t.spd*(1+h.gear*.03);
  if(h.state==='fight'){const tg=h.target;if(!tg||tg.dead){h.target=null;h.state='idle';h.think=0;return;}
    const r=h.t.range+(tg.ent==='lair'?tg.r*.7:0),d=dist(h,tg);if(d>r)moveTo(h,tg.x,tg.y,spd,dt);else{h.face=tg.x<h.x?-1:1;if(h.cd<=0){h.cd=h.t.cd;attack(h,tg);}}}
  else if(h.state==='flee'||h.state==='go'){const b=h.dest;if(!b||b.dead){h.state='idle';h.think=0;return;}if(moveTo(h,b.x,baseY(b)+5,spd*(h.state==='flee'?1.15:1),dt)<6)arrive(h,b);}
  else{if(h.waitT>0){h.waitT-=dt;return;}if(!h.wp)h.wp=patrolPt(h,isNight()?null:(h.type==='fazendeiro'?120:380));
    if(moveTo(h,h.wp.x,h.wp.y,spd*.55,dt)<5){h.wp=null;h.waitT=.6+Math.random()*1.5;}}
}
function minionUpdate(m,dt){
  m.life-=dt;const o=m.owner;
  if(m.life<=0||!o||o.dead){m.dead=true;burst(m.x,m.y-6,m.type==='servo'?PAL.z0:PAL.n3,10);if(sel===m)select(null);return;}
  m.think-=dt;if(m.think<=0){m.think=.4;const e=nearest(G.units,m,240,u=>u.mon);if(e){m.state='fight';m.target=e;}else{m.state='idle';m.target=null;}}
  const tg=m.target;
  if(m.state==='fight'&&tg&&!tg.dead){if(dist(m,tg)>m.t.range)moveTo(m,tg.x,tg.y,m.t.spd,dt);else{m.face=tg.x<m.x?-1:1;if(m.cd<=0){m.cd=m.t.cd;attack(m,tg);}}}
  else{const ox=o.inside?o.inside.x:o.x,oy=o.inside?baseY(o.inside)+8:o.y,tx=ox+(m.id%2?14:-14),ty=oy+6;if(Math.hypot(m.x-tx,m.y-ty)>10)moveTo(m,tx,ty,m.t.spd*.8,dt);}
}
function workerThink(w){
  if(workersHide()){if(w.state!=='home'){if(w.field){w.field.claim=null;w.field=null;}w.state='home';w.dest=w.home&&!w.home.dead?w.home:casa();}return;}
  const threat=nearest(G.units,w,75,u=>u.mon);
  if(threat){if(w.state!=='flee'){if(w.field){w.field.claim=null;w.field=null;}w.state='flee';w.dest=dropPoint(w);}return;}
  if(w.state==='flee')return;
  if(w.carry){if(w.state!=='carry'){w.state='carry';w.dest=dropPoint(w);}return;}
  if(w.state==='toField'&&w.field&&!w.field.dead&&w.field.g>=1&&w.field.claim===w)return;
  let best=null,bd=1e9;for(const b of G.buildings){if(!isField(b)||b.g<1||b.dead)continue;if(b.claim&&b.claim!==w&&!b.claim.dead&&b.claim.field===b)continue;const d=dist(w,b);if(d<bd){bd=d;best=b;}}
  if(best){best.claim=w;w.field=best;w.state='toField';w.workT=0;return;}
  if(w.state!=='idle'){w.state='idle';w.wp=null;}
}
function workerUpdate(w,dt){
  if(w.inside){w.hideT=(w.hideT||0)-dt;if(!workersHide()&&w.hideT<=0){leaveB(w);w.state='idle';w.wp=null;w.think=0;}return;}
  w.think-=dt;if(w.think<=0){w.think=.35+Math.random()*.2;workerThink(w);}
  const spd=w.t.spd*(w.carry?.85:1);
  if(w.state==='toField'){const f=w.field;if(!f||f.dead||f.g<1){if(f&&f.claim===w)f.claim=null;w.field=null;w.state='idle';w.think=0;return;}
    if(moveTo(w,f.x,f.y,spd,dt)<10){w.workT=(w.workT||0)+dt;if(Math.random()<.1)w.swingT=.25;
      if(w.workT>=1.4){w.workT=0;const c=fieldYield(f);w.carry=c;f.g=0;f.ripeT=0;f.claim=null;w.field=null;burst(f.x,f.y,cropColor(c.crop),5);w.state='carry';w.dest=dropPoint(w);}}}
  else if(w.state==='carry'||w.state==='home'||w.state==='flee'){let b=w.dest;if(!b||b.dead){b=w.dest=w.state==='home'?casa():dropPoint(w);}
    if(moveTo(w,b.x,baseY(b)+5,spd*(w.state==='flee'?1.25:1),dt)<6){if(w.carry){deposit(w.carry,b);w.carry=null;}
      if(w.state==='home'||w.state==='flee'){enterB(w,b);w.hideT=w.state==='flee'?6:0;w.state='rest';}else{w.state='idle';w.wp=null;w.think=0;}}}
  else{if(w.waitT>0){w.waitT-=dt;return;}if(!w.wp)w.wp=patrolPt(w,90);if(moveTo(w,w.wp.x,w.wp.y,spd*.45,dt)<5){w.wp=null;w.waitT=1+Math.random()*2;}}
}
function monThink(m){
  if(m.t.beast){const p=nearest(G.units,m,420,u=>u.hero||u.worker);if(p){m.target=p;return;}
    if(m.target&&!m.target.dead&&m.target.ent==='b')return;let best=null,bd=650;for(const b of G.buildings){if(!isField(b))continue;const d=dist(m,b);if(d<bd){bd=d;best=b;}}m.target=best;return;}
  const cursed=nearest(G.units,m,170,u=>u.hero&&u.trait==='Amaldiçoado');const h=cursed||nearest(G.units,m,m.t.boss?90:115,u=>u.hero||u.worker);
  if(h){m.target=h;return;}if(m.target&&m.target.ent==='b'&&!m.target.dead)return;if(m.t.boss){m.target=casa();return;}
  let best=null,bd=1e9;for(const b of G.buildings){if(m.type==='strigoi'&&isField(b))continue;const d=dist(m,b)*(isField(b)?.8:1);if(d<bd){bd=d;best=b;}}m.target=best;
}
function monUpdate(m,dt,dark){
  if(m.t.burns&&dark<.35){m.hp-=12*dt;if(Math.random()<.35)part(m.x+rnd(-3,3),m.y-10,rnd(-6,6),rnd(-30,-15),.9,Math.random()<.5?PAL.e4:PAL.e5,1,'spark');
    if(m.hp<=0){killU(m,null);if(!G.sunMsg){G.sunMsg=true;msg('Os strigoi pegaram sol. Cheiro de churrasco.','good');}return;}}
  m.think-=dt;if(m.think<=0){m.think=.5+Math.random()*.3;monThink(m);}
  const tg=m.target;
  if(!tg||tg.dead||tg.inside){m.think=Math.min(m.think,.3);
    if(m.t.beast){if(!m.wp||dist(m,m.wp)<8)m.wp={x:clamp(m.x+rnd(-200,200),30,W-30),y:clamp(m.y+rnd(-150,150),90,H-30)};moveTo(m,m.wp.x,m.wp.y,m.t.spd*.4,dt);}return;}
  const isB=tg.ent==='b';const d=isB?rectDist(m,tg):dist(m,tg);const rng=m.t.range*(m.t.boss?1.4:1);
  if(d>rng){const tx=isB?clamp(m.x,tg.x-tg.w/2,tg.x+tg.w/2):tg.x,ty=isB?clamp(m.y,tg.y-tg.dd/2,tg.y+tg.dd/2):tg.y;moveTo(m,tx,ty,m.t.spd,dt);}
  else{m.face=tg.x<m.x?-1:1;if(m.cd<=0){m.cd=m.t.cd;m.swingT=.25;hit(m,tg,m.atk);}}
}

/* ---------- atualização ---------- */
function update(dt){
  G.time+=dt;const ph=phaseOf(dayT());if(ph!==G.phase){G.phase=ph;onPhase(ph);if(G.over)return;}
  for(let i=G.spawnQ.length-1;i>=0;i--)if(G.time>=G.spawnQ[i].at){spawnFrom(G.spawnQ[i]);G.spawnQ.splice(i,1);}
  const dark=darkness();if(G.farmerCd>0)G.farmerCd-=dt;
  if(G.phase==='day'){G.wolfT-=dt;if(G.wolfT<=0){G.wolfT=rnd(28,42);spawnWolves();}}
  if(dark>.6&&Math.random()<dt/35)G.flash=.18;
  G.birdT-=dt;if(G.birdT<=0){G.birdT=rnd(14,30);const left=Math.random()<.5,y0=rnd(150,H-150),n=ri(3,7);
    for(let i=0;i<n;i++)G.birds.push({x:(left?-20:W+20)+rnd(-30,30),y:y0+rnd(-25,25),vx:(left?1:-1)*rnd(55,75),vy:rnd(-6,6),ph:Math.random()*6});}
  for(let i=G.birds.length-1;i>=0;i--){const b=G.birds[i];b.x+=b.vx*dt;b.y+=b.vy*dt+Math.sin(G.time*2+b.ph)*.3;if(b.x<-60||b.x>W+60)G.birds.splice(i,1);}
  G.smokeT-=dt;const puff=G.smokeT<=0;if(puff)G.smokeT=.3;
  for(const b of G.buildings){b.hitT=Math.max(0,b.hitT-dt);
    if(isField(b)){const rate=b.kind==='trigo'?(.5+1.5*b.heat)/35:(.45+1.1*(1-b.heat))/40;
      if(b.g<1)b.g=Math.min(1,b.g+dt*rate);else{b.ripeT+=dt;if(b.ripeT>45){b.g=0;b.ripeT=0;if(b.claim)b.claim=null;if(G.time>G.rotMsgT){msg('Um campo apodreceu no pé. Faltou camponês.','bad');G.rotMsgT=G.time+25;}}}}
    else if(b.kind==='torre'){b.cd-=dt;if(b.cd<=0){const m=nearest(G.units,b,BD.torre.range,u=>u.mon);if(m){const s=SB.torre;shoot(b.x,baseY(b)+s.wins[0].dy,m,BD.torre.dmg,b);b.cd=BD.torre.rate;}}}
    if(puff&&SB[b.kind]&&SB[b.kind].chim){const c=SB[b.kind].chim;part(b.x+c.dx+rnd(-1,1),baseY(b)+c.dy,rnd(-3,7),rnd(-20,-12),2.4,b.kind==='forja'?PAL.g2:PAL.g4,3,'smoke');
      if(b.kind==='forja'&&Math.random()<.7)part(b.x+c.dx,baseY(b)+c.dy,rnd(-10,10),rnd(-50,-30),.9,PAL.e4,1,'spark');}}
  for(const l of G.lairs){l.hitT=Math.max(0,l.hitT-dt);if(!l.dead&&l.alarm>0){l.alarm-=dt;l.defT-=dt;if(l.defT<=0){l.defT=6;spawnFrom({type:l.kind==='cemiterio'?'esqueleto':'strigoi',src:l});}}}
  G.emberT-=dt;if(G.emberT<=0&&G.lightPts.length){G.emberT=dark>.3?.05:.18;const p=pick(G.lightPts);part(p.x+rnd(-6,6),p.y,rnd(-5,5),rnd(-28,-12),1.4,Math.random()<.3?PAL.e5:PAL.e4,1,'spark');}
  for(const u of G.units){if(u.dead)continue;u.hitT=Math.max(0,u.hitT-dt);u.swingT=Math.max(0,u.swingT-dt);u.cd-=dt;u.moving=false;
    if(u.hero){if(u.t.minion)minionUpdate(u,dt);else heroUpdate(u,dt);}else if(u.worker)workerUpdate(u,dt);else monUpdate(u,dt,dark);if(u.moving)u.anim+=dt;if(G.over)return;}
  const us=G.units.filter(u=>!u.dead&&!u.inside);
  for(let i=0;i<us.length;i++){const a=us[i];for(let j=i+1;j<us.length;j++){const b=us[j];const dx=b.x-a.x,dy=b.y-a.y;if(dx>9||dx<-9||dy>9||dy<-9)continue;
    const d=Math.hypot(dx,dy)||.01;if(d<8){const p=(8-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p;}}}
  for(const u of us){u.x=clamp(u.x,10,W-10);u.y=clamp(u.y,30,H-10);}
  for(let i=G.proj.length-1;i>=0;i--){const p=G.proj[i],tg=p.tg;if(tg.dead){G.proj.splice(i,1);continue;}
    const ty=tg.ent==='u'?tg.y-9:tg.y-10,dx=tg.x-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);
    if(d<6){G.proj.splice(i,1);hit(p.src,tg,p.dmg);if(G.over)return;continue;}p.x+=dx/d*p.spd*dt;p.y+=dy/d*p.spd*dt;p.a=Math.atan2(dy,dx);}
  G.units=G.units.filter(u=>!u.dead);
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.life-=dt;if(p.life<=0){G.parts.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.type==='spark')p.vy+=20*dt;else p.vx*=.99;}
  for(let i=G.floats.length-1;i>=0;i--){const f=G.floats[i];f.life-=dt;f.y-=12*dt;if(f.life<=0)G.floats.splice(i,1);}
}
function endGame(win){
  if(G.over)return;G.over=true;buildMode=null;refreshBar();updateHint();select(null);updateQuest();$('#roster').hidden=true;
  G.endWin=win;showScreen('end');
}

const Store={db:null,uid:null,kind:'local',ready:null};
Store.ready=(async()=>{
  for(let i=0;i<30&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
  if(!(window.claude&&window.claude.use))return;
  try{const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(db&&user){const id=await user.id();if(id){Store.db=db;Store.uid=id;Store.kind='cloud';}}}catch(e){}
})();
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);}
const SLOTS=[1,2,3];
function saveRef(n){return Store.db.doc('data/users/'+Store.uid+'/save'+n);}
const lsKey=n=>'hdc_save_'+n;
function newer(a,b){if(a&&b)return (a.savedAt||0)>=(b.savedAt||0)?a:b;return a||b||null;}
async function readSlot(n){
  let cloud=null,local=null;
  if(Store.db){try{const s=await withTimeout(saveRef(n).get(),9000);if(s.exists)cloud=s.data();}catch(e){}
    if(n===1&&!cloud){try{const s=await withTimeout(Store.db.doc('data/users/'+Store.uid+'/save').get(),9000);if(s.exists)cloud=s.data();}catch(e){}}}
  try{const t=localStorage.getItem(lsKey(n))||(n===1?localStorage.getItem('hdc_save'):null);if(t)local=JSON.parse(t);}catch(e){}
  return newer(cloud,local);
}
async function readAllSlots(){await Store.ready;return Promise.all(SLOTS.map(readSlot));}
let saving=false;
async function saveGame(auto,slot){
  if(!G||G.over||!started||saving)return false;slot=slot||G.slot||1;saving=true;
  const body={v:2,slot,savedAt:Date.now(),day:G.nightsDone+1,phase:G.phase,gold:G.gold,heroes:heroList().length,state:JSON.stringify(serialize())};
  let where=null;
  try{localStorage.setItem(lsKey(slot),JSON.stringify(body));where='local';}catch(e){}
  await Store.ready;
  if(Store.db){try{await withTimeout(saveRef(slot).set(body),9000);where='cloud';}catch(e){}}
  saving=false;
  if(where){G.slot=slot;G.lastSave=Date.now();cachedSlots[slot-1]=body;}
  if(where)msg(auto?`Salvo sozinho no slot ${slot}.`:where==='cloud'?`Salvo no slot ${slot}, na sua conta. Continua no celular ou no PC.`:`Salvo no slot ${slot}, neste navegador.`,'good');
  else msg('Não deu pra salvar. O navegador recusou.','bad');
  return where;
}
function serialize(){
  const bi=new Map(G.buildings.map((b,i)=>[b,i]));const ref=b=>b&&bi.has(b)?bi.get(b):-1;
  return {seed:G.seed,time:G.time,gold:G.gold,trigo:G.trigo,alho:G.alho,nightsDone:G.nightsDone,nightNum:G.nightNum,phase:G.phase,price:G.price,quest:G.quest,
    blessed:G.blessed,taxDue:G.taxDue,farmerCd:G.farmerCd,wolfMsg:G.wolfMsg,wolfT:G.wolfT,firstTav:!!G.firstTav,stats:G.stats,fallen:G.fallen.slice(0,30),
    lairs:G.lairs.map(l=>({hp:l.hp,dead:l.dead,bounty:l.bounty})),
    buildings:G.buildings.map(b=>({k:b.kind,x:b.x,y:b.y,hp:b.hp,g:b.g,r:b.ripeT,cd:b.cd,p:b.prestige||null})),
    units:G.units.filter(u=>!u.dead&&!u.t.minion).map(u=>({t:u.type,x:Math.round(u.x),y:Math.round(u.y),hp:u.hp,mh:u.maxHp,atk:u.atk,lvl:u.lvl,xp:u.xp,gold:u.gold,gear:u.gear,
      kills:u.kills,name:u.name||null,trait:u.trait||null,home:ref(u.home),inside:ref(u.inside),st:u.inside?u.state:null,carry:u.carry,life:u.life||0,bounty:u.bounty,born:u.born})),
    spawnQ:G.spawnQ.map(q=>({at:q.at,type:q.type,src:G.lairs.indexOf(q.src)})),cam:{x:cam.x,y:cam.y}};
}
function loadGame(body){
  const s=JSON.parse(body.state);const R=mulberry32(s.seed);
  G=freshG(s.seed);genMap(R);
  for(const k of ['time','gold','trigo','alho','nightsDone','nightNum','phase','price','quest','blessed','taxDue','farmerCd','wolfMsg','wolfT','firstTav','stats','fallen'])if(s[k]!==undefined)G[k]=s[k];
  G.lairs.forEach((l,i)=>Object.assign(l,s.lairs[i]||{}));
  const LEG_B={merc:'g_warrior',cacador:'g_archer',capela:'g_healer'},LEG_U={mercenario:'warrior',cacador:'archer',padre:'healer'};
  for(const b of s.buildings){const k=LEG_B[b.k]||b.k;if(!BD[k])continue;const nb=addB(k,b.x,b.y);nb.hp=Math.min(b.hp,nb.maxHp);nb.g=b.g;nb.ripeT=b.r||0;nb.cd=b.cd||0;nb.prestige=b.p||null;}
  G.casa=G.buildings.find(b=>b.kind==='casa');
  for(const u of s.units){u.t=LEG_U[u.t]||u.t;if(!UT[u.t])continue;const nu=addU(u.t,u.x,u.y,{name:u.name||undefined,trait:u.trait||undefined,life:u.life,born:u.born});
    Object.assign(nu,{hp:u.hp,maxHp:u.mh,atk:u.atk,lvl:u.lvl,xp:u.xp,gold:u.gold,gear:u.gear,kills:u.kills,bounty:u.bounty||0,carry:u.carry||null});
    if(u.home>=0)nu.home=G.buildings[u.home];if(u.inside>=0&&G.buildings[u.inside]){enterB(nu,G.buildings[u.inside]);nu.state=u.st||'rest';}}
  G.spawnQ=(s.spawnQ||[]).map(q=>({at:q.at,type:q.type,src:G.lairs[q.src]||null}));
  cam.x=s.cam?s.cam.x:W/2;cam.y=s.cam?s.cam.y:H/2;
  G.lastSave=Date.now();sel=null;buildMode=null;$('#log').innerHTML='';renderBar();updatePanel(true);updateHint();renderRoster(true);
}

  catch(err){msg('Esse save está estragado. Escolha outro slot ou comece um novo jogo.','bad');showScreen('main');}}

function refreshSaveInfo(){return readAllSlots().then(a=>{cachedSlots=a;saveChecked=true;if((screen==='main'||screen==='slots')&&!$('#overlay').hidden)showScreen(screen);});}
$('#cBody').addEventListener('click',async e=>{
  const o=e.target.closest('[data-opt]');
  if(o){let v=o.dataset.val;v=v==='true'?true:v==='false'?false:/^\d+$/.test(v)?+v:v;OPTS[o.dataset.opt]=v;saveOpts();if(o.dataset.opt==='pixel')applyOpts(false);showScreen('opts');return;}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='main'){started=false;showScreen('main');refreshSaveInfo();}
  else if(act==='new'){confirmSlot=0;slotMode='new';slotBack='main';
    if(cachedSlots.every(s=>!s)){pendingSlot=1;showScreen('intro');}else showScreen('slots');}
  else if(act==='loadMenu'){confirmSlot=0;slotMode='load';slotBack='main';showScreen('slots');}
  else if(act==='saveAs'){confirmSlot=0;slotMode='save';slotBack='pause';showScreen('slots');}
  else if(act==='slot'){const n=+a.dataset.n,s=cachedSlots[n-1];
    if(slotMode==='load'){if(s)doLoad(s,n);}
    else if(slotMode==='new'){if(s&&confirmSlot!==n){confirmSlot=n;showScreen('slots');return;}confirmSlot=0;pendingSlot=n;showScreen('intro');}
    else{if(s&&G.slot!==n&&confirmSlot!==n){confirmSlot=n;showScreen('slots');return;}confirmSlot=0;a.disabled=true;await saveGame(false,n);showScreen('pause');}}
  else if(act==='start'){startPlay();}
  else if(act==='restart'){pendingSlot=G.slot||1;startPlay();}
  else if(act==='continue'){const ls=latestSlot();if(ls)doLoad(cachedSlots[ls-1],ls);}
  else if(act==='reloadSlot'){const n=G.slot||1;if(cachedSlots[n-1])doLoad(cachedSlots[n-1],n);}
  else if(act==='opts'){optsBack='main';showScreen('opts');}
  else if(act==='optsP'){optsBack='pause';showScreen('opts');}
  else if(act==='resume'){$('#overlay').hidden=true;screen='game';}
  else if(act==='pause')showScreen('pause');
  else if(act==='save'){a.disabled=true;$('#saveStatus').textContent='Salvando...';const w=await saveGame(false);
    if(screen==='pause'){$('#saveStatus').textContent=w==='cloud'?'Salvo na sua conta agora.':w==='local'?'Salvo neste navegador agora.':'Não deu pra salvar.';a.disabled=false;}}
  else if(act==='quit')showScreen('quit');
  else if(act==='saveQuit'){a.disabled=true;await saveGame(false);started=false;newGame();showScreen('main');refreshSaveInfo();}
  else if(act==='quitNoSave'){started=false;newGame();showScreen('main');refreshSaveInfo();}
});
function openPause(){if(!G||!started||G.over)return;buildMode=null;refreshBar();updateHint();showScreen('pause');}

/* ---------- desenho em pixel ---------- */
function R_(x,y,w,h,c){bx.fillStyle=c;bx.fillRect(Math.round(x),Math.round(y),w,h);}
function inView(x,y,m){return x>OX-m&&x<OX+bw+m&&y>OY-m&&y<OY+bh+m*1.6;}
function shadow(x,y,rx){x=Math.round(x);y=Math.round(y);bx.fillStyle='rgba(8,6,8,.5)';bx.fillRect(x-rx,y,rx*2+1,1);bx.fillRect(x-rx+1,y-1,rx*2-1,1);bx.fillRect(x-rx+1,y+1,rx*2-1,1);}
function drawField(b,T){
  const x0=Math.round(b.x-b.w/2),y0=Math.round(b.y-b.dd/2),w=b.w,h=b.dd,wheat=b.kind==='trigo',ripe=b.g>=1;
  R_(x0-1,y0-1,w+2,h+2,PAL.k2);R_(x0,y0,w,h,PAL.w0);
  for(const [cx,cy] of [[x0-1,y0-1],[x0+w,y0-1],[x0-1,y0+h],[x0+w,y0+h]]){R_(cx,cy-4,1,5,PAL.w2);R_(cx,cy-4,1,1,PAL.w3);}
  const rows=wheat?6:5,cols=wheat?11:8;
  for(let i=0;i<rows;i++){const y=y0+3+Math.round(i*(h-6)/(rows-1));R_(x0+1,y,w-2,1,PAL.w1);R_(x0+1,y+1,w-2,1,PAL.k3);
    if(b.g<=.03)continue;
    for(let j=0;j<cols;j++){const x=x0+3+Math.round(j*(w-6)/(cols-1));
      if(wheat){const hg=1+Math.round(b.g*5);const sway=ripe&&((T*3+j*.7+i)%4)<1?1:0;
        R_(x+sway,y-hg,1,hg,ripe?((i+j)%3?PAL.y2:PAL.y1):b.g>.6?PAL.y0:PAL.v1);if(ripe)R_(x+sway,y-hg-1,1,1,PAL.e5);}
      else{const lh=1+Math.round(b.g*3);R_(x-1,y-lh,1,lh,PAL.v1);R_(x+1,y-lh+1,1,lh,PAL.v2);if(b.g>.45)R_(x-1,y-1,3,2,ripe?PAL.g7:PAL.g5);}}}
  if(ripe&&Math.sin(T*5)>0){bx.fillStyle=wheat?PAL.e5:PAL.g7;bx.fillRect(x0-2,y0-2,w+4,1);bx.fillRect(x0-2,y0+h+1,w+4,1);bx.fillRect(x0-2,y0-2,1,h+4);bx.fillRect(x0+w+1,y0-2,1,h+4);}
  if(b.hitT>0){bx.fillStyle='rgba(255,255,255,.4)';bx.fillRect(x0,y0,w,h);}
}
function drawBuilding(b){
  const s=SB[b.kind],x=Math.round(b.x)-s.ax,y=Math.round(baseY(b))-s.ay;
  bx.fillStyle='rgba(8,6,8,.45)';for(let i=0;i<5;i++)bx.fillRect(x+6+i,Math.round(baseY(b))+1+i-2,s.spr.width-8,1);
  bx.drawImage(s.spr,x,y);
  if(b.prestige)bx.drawImage(BANNER[b.prestige],x-2,y-6);
  if(b.hitT>0){bx.globalAlpha=.6;bx.drawImage(whiteOf(s.spr),x,y);bx.globalAlpha=1;}
}
function drawLair(l){const s=l.kind==='cemiterio'?LAIR.cem:LAIR.nin,a=LAIR_ANCH[l.kind];const x=l.x-a.x,y=l.y-a.y;
  if(l.dead){bx.globalAlpha=.45;bx.drawImage(s,x,y);bx.globalAlpha=1;return;}bx.drawImage(s,x,y);if(l.hitT>0){bx.globalAlpha=.5;bx.drawImage(whiteOf(s),x,y);bx.globalAlpha=1;}}
function drawDecor(o){if(o.kind==='prop'){const p=PROPS[o.type];shadow(o.x+2,o.y,Math.round(o.spr.width/3));bx.drawImage(o.spr,o.x-p.ax,o.y-p.ay);}
  else if(o.kind==='tree'){shadow(o.x+4,o.y,7);bx.drawImage(o.spr,o.x-17,o.y-46);}else bx.drawImage(o.spr,o.x-Math.round(o.spr.width/2),o.y-8);}
function unitFrame(u){if(u.swingT>0)return 3;if(u.moving)return [1,0,2,0][Math.floor(u.anim*9)%4];return 0;}
function unitSpr(u,f,face){const s=SU[u.type];return (face<0?s.l:s.r)[f];}
function drawUnit(u){
  const s=SU[u.type],f=unitFrame(u),spr=(u.face<0?s.l:s.r)[f];const ax=u.face<0?spr.width-1-s.ax:s.ax;
  const x=Math.round(u.x)-ax,y=Math.round(u.y)-s.ay;
  shadow(u.x,u.y,u.t.boss?8:u.type==='lobo'?6:4);
  if(u.worker&&u.carry){const sx=Math.round(u.x)-u.face*4-1;R_(sx-1,Math.round(u.y)-13,4,5,PAL.k);R_(sx,Math.round(u.y)-12,2,3,u.carry.crop==='trigo'?PAL.w3:PAL.g6);}
  if(u.type==='espirito')bx.globalAlpha=.7;
  bx.drawImage(spr,x,y);bx.globalAlpha=1;
  if(u.hitT>0){bx.globalAlpha=.75;bx.drawImage(whiteOf(spr),x,y);bx.globalAlpha=1;}
}
function eyePts(u){const s=SU[u.type];return s.eye.map(e=>({x:Math.round(u.x)+e.dx*u.face,y:Math.round(u.y)+e.dy}));}
function quantize(){
  const id=bx.getImageData(0,0,bw,bh),d=id.data,ox=OX&3,oy=OY&3;
  for(let y=0;y<bh;y++){const row=((y+oy)&3)<<2;let i=y*bw*4;

function pathText(h){
  if(h.type==='fazendeiro')return 'Você mesmo';if(h.t.tier===2)return `${UT[h.t.base].name} → ${h.t.name} (prestígio)`;

}
function stateText(h){
  if(h.t&&h.t.minion)return h.state==='fight'?'Lutando':'Seguindo '+(h.owner?h.owner.name:'ninguém');
  if(h.worker){if(h.inside)return 'Trancado em casa';if(h.state==='toField')return 'Indo colher';if(h.state==='carry')return `Levando ${h.carry?h.carry.amt+' de '+h.carry.crop:'a colheita'} pra casa`;
    if(h.state==='flee')return 'Correndo de um monstro';if(h.state==='home')return 'Indo se trancar';return 'Esperando algo amadurecer';}
  if(h.inside)return h.state==='drink'?'Bebendo. É noite, afinal.':h.inside.kind==='taverna'?'Comendo, bebendo e pagando':'Descansando';
  if(h.state==='fight')return h.target&&h.target.bounty?'Atrás da recompensa':h.target&&h.target.ent==='lair'?'Atacando o covil':h.target&&h.target.type==='lobo'?'Caçando lobo':'Brigando';
